  flexors:{kind:'主要组成肌肉',items:[['桡侧腕屈肌',null],['尺侧腕屈肌',null],['掌长肌',null],['指浅屈肌',null],['指深屈肌（深层）',null],['拇长屈肌（深层）',null]],note:'模型肌束为概括示意，不与每块肌肉一一对应。'},
  extensors:{kind:'主要组成肌肉',items:[['桡侧腕长伸肌',null],['桡侧腕短伸肌',null],['尺侧腕伸肌',null],['指伸肌',null]],note:'模型肌束为概括示意，不与每块肌肉一一对应。'},
  deltoid:{kind:'肌束（同一块肌肉的分部）',items:[['前束',[.205,1.398,.041]],['中束',[.21,1.397,.008]],['后束',[.201,1.405,-.030]]]},
  biceps:{kind:'肌头（同一块肌肉的分部）',items:[['长头',null],['短头',null]],note:'当前模型表示共同肌腹，未分开显示两头。'},
  triceps:{kind:'肌头（同一块肌肉的分部）',items:[['长头',null],['外侧头',null],['内侧头（部分位于深层）',null]],note:'当前模型表示整体轮廓，未分开显示三头。'},
  trapezius:{kind:'肌束（同一块肌肉的分部）',items:[['上束',[.065,1.48,-.065]],['中束',[.072,1.415,-.098]],['下束',[.037,1.32,-.09]]]},
  pectoral:{kind:'分部（同一块肌肉）',items:[['锁骨部',[.08,1.435,.13]],['胸肋部',[.085,1.355,.14]]]},
  rectus:{kind:'结构说明',items:[],note:'腹直肌是一对连续肌带；表面的分块由腱划形成，不是多块独立的小肌肉。'},
  serratus:{kind:'结构说明',items:[],note:'锯齿状肌束属于同一块前锯肌，不是多块独立肌肉。'}
};
const componentLabels=[];
function showComponents(id){
  componentLabels.forEach(el=>el.remove());componentLabels.length=0;
  const data=components[id];$('#components').hidden=!data;
  if(!data)return;
  $('#componentTitle').textContent=data.kind;
  $('#componentList').replaceChildren();
  for(const [name,point] of data.items){
    const item=document.createElement('li');item.textContent=name;$('#componentList').appendChild(item);
    if(point){const el=document.createElement('div');el.className='component-label';el.textContent=name;el.hidden=true;el.anchor=point;$('#labels').appendChild(el);componentLabels.push(el);}
  }
  if(data.note){const item=document.createElement('li');item.textContent=data.note;$('#componentList').appendChild(item);}
}

const posteriorMuscles=new Set(['trapezius','latissimus','erector','triceps','extensors','hamstrings','gluteus','gastrocnemius']);
function selectFromNavigation(id){
  const wasFocused=state.focused;
  state.focused=false;
  select(id);
  const view=posteriorMuscles.has(id)?'back':'front';
  const direction=camera.position.clone().sub(controls.target).normalize();
  const facing=direction.z*(view==='back'?-1:1);
  // Use actual camera direction after manual dragging; replace stale transitions.
  if(facing<.45||tween||wasFocused){
    setView(view);
    if(wasFocused&&tween?.orbit){
      tween.target=state.selectedPart.center.clone().applyMatrix4(state.selectedPart.group.matrixWorld);
      state.focused=true;
    }
  }
}
function select(id,part=null){
  const wasFocused=state.focused;
  showComponents(id);
  state.selected=id;state.selectedPart=id?(part??preferredPart(id)):null;
  if(!id)state.isolate=false;
  $('#detail').hidden=!id;$('#overview').hidden=!!id;$('#clearSelection').hidden=!id;
  $('#isolate').setAttribute('aria-pressed',String(state.isolate));
  if(id){
    const d=dataById.get(id);
    const entry=Object.entries(muscleGroups).find(([,ids])=>ids.includes(id));
    $('#noteLink').hidden=!entry;
    if(entry){$('#noteLink').href='./muscle-'+entry[0]+'.md';$('#noteLink').textContent='阅读'+groupNames[entry[0]]+'部肌肉笔记 ↗';}
    $('#detailIndex').textContent='肌肉'+' / '+regions[d.region];$('#detailName').textContent=d.name;$('#detailLatin').textContent=d.latin;$('#detailDescription').textContent=d.description;$('#detailAction').textContent=d.action;
  }
  for(const [key,label]of labels)label.classList.toggle('active',key===id);
  $$('.part-row').forEach(b=>{b.classList.toggle('active',b.dataset.id===id);b.setAttribute('aria-pressed',String(b.dataset.id===id));});
  updateMaterials();
  if(wasFocused){if(id)focusSelected();else setView(state.view);}
  if(id&&viewport.clientWidth<801)viewport.scrollIntoView({behavior:reduced?'instant':'smooth',block:'start'});
}
function transition(position,target){
  if(reduced){camera.position.copy(position);controls.target.copy(target);tween=null;controls.update();}
  else tween={from:camera.position.clone(),to:position,fromTarget:controls.target.clone(),target,elapsed:0};
}
function scaleFactor(){return viewport.clientWidth<800?1.04:1;}
function setView(view,immediate=false){
  state.view=view;state.focused=false;controls.autoRotate=false;
  const target=immediate?new THREE.Vector3(0,.82,0):controls.target.clone(),dist=3.88*scaleFactor();
  const positions={front:new THREE.Vector3(.035,.01,dist),back:new THREE.Vector3(-.035,.01,-dist),side:new THREE.Vector3(dist,.01,.02)};
  const pos=positions[view].add(target);
  if(immediate){camera.position.copy(pos);controls.target.copy(target);tween=null;controls.update();}
  else {
    // Interpolate angles on an orbit, never along a chord through the body.
    const from=new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
    const to=new THREE.Spherical().setFromVector3(pos.clone().sub(target));
    let delta=THREE.MathUtils.euclideanModulo(to.theta-from.theta+Math.PI,Math.PI*2)-Math.PI;
    if(Math.abs(Math.abs(delta)-Math.PI)<.02)delta=Math.PI;
    if(reduced){camera.position.copy(pos);controls.target.copy(target);tween=null;controls.update();}
    else tween={orbit:true,fromAngle:from.theta,delta,phi:from.phi,toPhi:to.phi,radius:from.radius,toRadius:from.radius,fromTarget:controls.target.clone(),target,elapsed:0};
  }
  $$('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));
  $('#viewName').textContent={front:'前面观',back:'后面观',side:'侧面观'}[view];
}
function focusSelected(){
  if(!state.selectedPart)return;
  stopDemo();controls.autoRotate=false;
  const box=new THREE.Box3().setFromObject(state.selectedPart.group),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
  const dist=Math.max(.44,Math.max(size.x,size.y,size.z)*3.05)*scaleFactor();
  const d=dataById.get(state.selected),posterior=posteriorMuscles.has(d.id);
  const direction=new THREE.Vector3(posterior?-.22:.19,.12,posterior?-1:1).normalize();
  transition(center.clone().addScaledVector(direction,dist),center);state.focused=true;$('#viewName').textContent=d.name+' · 细节';
  if(viewport.clientWidth<801)viewport.scrollIntoView({behavior:reduced?'instant':'smooth',block:'start'});
}
function stopDemo(){}
function updateRanges(){
  $('#opacityValue').innerHTML=Math.round(state.opacity*100)+'<span>%</span>';$('#opacity').style.setProperty('--progress',((state.opacity*100-10)/.9)+'%');
}

$('#search').oninput=e=>{state.query=e.target.value.trim().toLowerCase();updateList();};
$('#region').onchange=e=>{state.region=e.target.value;state.isolate=false;select(null);if(muscleGroups[state.region]){setMode('muscle');setView(['back','glutes'].includes(state.region)?'back':'front');}updateList();updateMaterials();};
$$('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$('#closeDetail').onclick=$('#clearSelection').onclick=()=>select(null);
$('#startExplore').onclick=()=>{select('pectoral');focusSelected();};
$('#focus').onclick=focusSelected;
$('#isolate').onclick=()=>{if(!state.selected)return;state.isolate=!state.isolate;$('#isolate').setAttribute('aria-pressed',String(state.isolate));updateMaterials();focusSelected();};
$('#opacity').oninput=e=>{state.opacity=Number(e.target.value)/100;updateRanges();updateMaterials();};
$('#home').onclick=()=>{stopDemo();state.isolate=false;select(null);state.opacity=1;$('#opacity').value=100;setMode('muscle');state.query='';$('#search').value='';state.region='all';$('#region').value='all';state.system='muscle';$$('[data-system]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.system==='muscle')));updateList();updateRanges();updateMaterials();setView('front',true);};
controls.addEventListener('start',()=>{tween=null;$('#viewName').textContent='自由视角';$$('[data-view]').forEach(b=>b.setAttribute('aria-pressed','false'));});

function pick(x,y){
  const r=canvas.getBoundingClientRect();pointer.set((x-r.left)/r.width*2-1,-(y-r.top)/r.height*2+1);raycaster.setFromCamera(pointer,camera);
  return raycaster.intersectObjects(anatomy.pickables.filter(o=>o.userData.system==='muscle'),false).find(hit=>{if(hit.object.material.opacity<.2)return false;let o=hit.object;while(o){if(!o.visible)return false;o=o.parent;}return true;});
}
canvas.addEventListener('pointerdown',e=>{dragStart={x:e.clientX,y:e.clientY,time:performance.now()};});
canvas.addEventListener('pointermove',e=>{pointerX=e.clientX;pointerY=e.clientY;pointerDirty=true;pointerInside=true;});
canvas.addEventListener('pointerleave',()=>{pointerInside=false;canvas.style.cursor='grab';});
canvas.addEventListener('pointerup',e=>{if(dragStart&&Math.hypot(e.clientX-dragStart.x,e.clientY-dragStart.y)<6&&performance.now()-dragStart.time<650){const hit=pick(e.clientX,e.clientY);if(hit){const {id,side}=hit.object.userData;select(id,anatomy.parts.find(p=>p.id===id&&p.side===side));}else select(null);}dragStart=null;});
canvas.addEventListener('pointercancel',()=>{dragStart=null;});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){select(null);}if(e.target===canvas&&e.key.toLowerCase()==='f')focusSelected();});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();$('#loading').classList.remove('done');$('#loading').removeAttribute('aria-hidden');$('#loadingText').textContent='图形上下文已暂停，请刷新恢复。';});

const projection=new THREE.Vector3();
function screenPoint(point){projection.copy(point).project(camera);return{x:(projection.x*.5+.5)*viewport.clientWidth,y:(-.5*projection.y+.5)*viewport.clientHeight,z:projection.z};}
function updateLabels(){
  const posterior=camera.position.z<controls.target.z;
  const muscleSet=posterior?['trapezius','latissimus','triceps','gluteus','hamstrings','gastrocnemius']:['pectoral','deltoid','rectus','biceps','quadriceps','tibialis'];
  let visible=state.selected?[state.selected]:muscleSet;
  const occupied=[],leaders=[];
  for(const d of catalog){
    const label=labels.get(d.id),show=visible.includes(d.id)&&!(state.selected===d.id&&componentLabels.length);label.hidden=!show;if(!show)continue;
    let part=state.selected===d.id?state.selectedPart:preferredPart(d.id);
    if(!state.selected){const side=visible.indexOf(d.id)%2===0?-1:1;part=anatomy.parts.find(p=>p.id===d.id&&p.side===side)??part;}
    labelTargets.set(d.id,part);
    if(!part.group.visible){label.hidden=true;continue;}
    let point=part.center.clone().applyMatrix4(part.group.matrixWorld);
    // Anchor the leader on the camera-facing surface, including selection scaling.
    const direction=point.clone().sub(camera.position).normalize();
    raycaster.set(camera.position,direction);
    const surface=raycaster.intersectObjects(part.group.children,false).find(hit=>hit.object.isMesh);
    if(surface)point=surface.point;
    const p=screenPoint(point),left=p.x<viewport.clientWidth*.5;
    if(p.z>1||p.z<-1){label.hidden=true;continue;}
    let x=p.x+(left?-65:65),y=p.y-8;
    const min=viewport.clientWidth<800?100:340,max=viewport.clientWidth-(viewport.clientWidth<800?100:335);
    x=THREE.MathUtils.clamp(x,min,max);y=THREE.MathUtils.clamp(y,18,viewport.clientHeight-88);
    for(const old of occupied)if(old.left===left&&Math.abs(y-old.y)<30)y=old.y+31;
    occupied.push({left,y});label.classList.toggle('left',left);label.style.left=x.toFixed(1)+'px';label.style.top=y.toFixed(1)+'px';
    const endY=y+label.offsetHeight/2;
    leaders.push('<path d="M '+p.x.toFixed(1)+' '+p.y.toFixed(1)+' L '+(x+(left?10:-10)).toFixed(1)+' '+endY.toFixed(1)+' L '+x.toFixed(1)+' '+endY.toFixed(1)+'"/><circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="2"/>');
  }
  if(state.selectedPart){
    const part=state.selectedPart;
    const anchors=[];
    componentLabels.forEach(label=>{
      let point=V([label.anchor[0]*part.side,label.anchor[1],label.anchor[2]]).applyMatrix4(part.group.matrixWorld);
      raycaster.set(camera.position,point.clone().sub(camera.position).normalize());
      const hit=raycaster.intersectObjects(part.group.children,false).find(h=>h.object.isMesh);
      label.hidden=!hit||!part.group.visible;
      if(label.hidden)return;
      point=hit.point;
      const p=screenPoint(point);
      if(p.z<-1||p.z>1){label.hidden=true;return;}
      anchors.push({label,p,w:label.offsetWidth,h:label.offsetHeight});
    });
    // Keep anatomical names attached to their anchors, sorting only their screen layout.
    // Horizontal exits share a rail outside every anchor; the ordered fan cannot cross.
    anchors.sort((a,b)=>a.p.y-b.p.y||a.p.x-b.p.x);
    if(anchors.length){
      const left=anchors.reduce((sum,a)=>sum+a.p.x,0)/anchors.length<viewport.clientWidth/2;
      const maxWidth=Math.max(...anchors.map(a=>a.w));
      const rail=left?Math.min(...anchors.map(a=>a.p.x))-12:Math.max(...anchors.map(a=>a.p.x))+12;
      const endX=left?Math.max(maxWidth+8,rail-74):Math.min(viewport.clientWidth-maxWidth-8,rail+74);
      const gap=Math.max(34,...anchors.map(a=>a.h+10));
      const center=anchors.reduce((sum,a)=>sum+a.p.y,0)/anchors.length;
      const top=THREE.MathUtils.clamp(center-(anchors.length-1)*gap/2,24,viewport.clientHeight-24-(anchors.length-1)*gap);
      anchors.forEach(({label,p,w,h},i)=>{
        const y=top+i*gap;
        label.style.left=(left?endX-w:endX)+'px';label.style.top=(y-h/2)+'px';
        leaders.push('<path d="M '+p.x+' '+p.y+' L '+rail+' '+p.y+' L '+endX+' '+y+'"/><circle cx="'+p.x+'" cy="'+p.y+'" r="2.5"/>');
      });
    }
  }
  $('#leaders').innerHTML=leaders.join('');
}
function updateRuler(){
  const svg=$('#ruler');if(state.focused||state.isolate||viewport.clientWidth<801){svg.style.opacity='0';return;}svg.style.opacity='.72';
  const rulerOffset=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0).multiplyScalar(-.49);
  const a=screenPoint(rulerOffset.clone().add(new THREE.Vector3(0,.02,0))),b=screenPoint(rulerOffset.clone().add(new THREE.Vector3(0,1.82,0)));
  let markup='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" />';
  for(let i=0;i<=18;i++){const p=screenPoint(rulerOffset.clone().add(new THREE.Vector3(0,.02+i*.1,0))),major=i%3===0;markup+='<line x1="'+(p.x-(major?8:4))+'" y1="'+p.y+'" x2="'+p.x+'" y2="'+p.y+'" />';if(major)markup+='<text x="'+(p.x-13)+'" y="'+(p.y+3)+'" text-anchor="end">'+i*10+'</text>';}
  markup+='<text x="'+(b.x-13)+'" y="'+(b.y-14)+'" text-anchor="end">CM</text>';svg.innerHTML=markup;
}
let initialized=false;
function resize(){const w=viewport.clientWidth,h=viewport.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();if(initialized&&!state.focused)setView(state.view,true);}
new ResizeObserver(resize).observe(viewport);resize();setView('front',true);initialized=true;
let last=performance.now();
function animate(now){
  requestAnimationFrame(animate);const raw=(now-last)/1000;last=now;if(document.hidden)return;const dt=Math.min(raw,.05);
  for(const p of anatomy.parts){
    if(p.system!=='muscle')continue;
    const targetScale=p===state.selectedPart?1.13:1;
    const scale=reduced?targetScale:THREE.MathUtils.damp(p.group.scale.x,targetScale,10,dt);
    if(Math.abs(scale-p.group.scale.x)>.00001)needsShadow=true;
    p.group.scale.setScalar(scale);
    // Scale around each muscle's own centre, preserving its anatomical attachment location.
    p.group.position.copy(p.center).multiplyScalar(1-scale);
  }
  if(tween){
    tween.elapsed+=dt;const t=Math.min(1,tween.elapsed/(tween.orbit?1.1:.85)),e=t*t*(3-2*t);
    controls.target.lerpVectors(tween.fromTarget,tween.target,e);
    if(tween.orbit){
      camera.position.setFromSpherical(new THREE.Spherical(tween.radius,THREE.MathUtils.lerp(tween.phi,tween.toPhi,e),tween.fromAngle+tween.delta*e)).add(controls.target);
    }else camera.position.lerpVectors(tween.from,tween.to,e);
    if(t===1)tween=null;
  }
  controls.update();scene.updateMatrixWorld();hoverTick++;
  if(pointerDirty&&pointerInside&&!dragStart&&hoverTick%6===0){canvas.style.cursor=pick(pointerX,pointerY)?'pointer':'grab';pointerDirty=false;}
  updateLabels();updateRuler();
  if(needsShadow){renderer.shadowMap.needsUpdate=true;needsShadow=false;}
  renderer.render(scene,camera);
}
updateList();updateMaterials();updateRanges();renderer.compile(scene,camera);
requestAnimationFrame(now=>{last=now;animate(now);$('#loading').classList.add('done');$('#loading').setAttribute('aria-hidden','true');});

</script>
